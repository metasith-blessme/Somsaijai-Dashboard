<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Som Sai Jai</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1>Som Sai Jai</h1>
    <span class="muted" id="status">Loading…</span>
  </header>

  <nav class="tabs">
    <a href="#daily" data-view="daily">Daily</a>
    <a href="#monthly" data-view="monthly">Monthly</a>
    <a href="#stock" data-view="stock">Stock</a>
    <a href="#log" data-view="log">Log</a>
  </nav>

  <main id="root"></main>

  <!-- Vendored locally; already in the repo. Loaded before the module so
       window.Chart exists when the monthly view mounts its canvases. -->
  <script src="chart.umd.min.js"></script>

  <script type="module">
    import { start } from './js/app.mjs';

    const root = document.getElementById('root');
    const status = document.getElementById('status');

    start(root)
      .then(() => { status.textContent = 'Live'; })
      .catch((err) => {
        // Last line of defence: even a failure inside start() shows something.
        console.error(err);
        status.textContent = 'Error';
        root.innerHTML =
          '<div class="card card-error"><div class="label">Could not start</div><p>' +
          String(err && err.message ? err.message : err) +
          '</p></div>';
      });
  </script>
</body>
</html>
