<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Som Sai Jai - Intelligence Premium</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
    --bg: #f5f5f7;
    --accent: #ff6600;
    --primary: #1f4e79;
    --card: rgba(255, 255, 255, 0.85);
    --glass-border: rgba(255, 255, 255, 0.3);
    --text: #1d1d1f;
    --muted: #86868b;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
    --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    --mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #000000;
        --card: rgba(28, 28, 30, 0.85);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text: #f5f5f7;
        --muted: #86868b;
        --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
}

.sidebar {
    width: 260px;
    height: calc(100vh - 40px);
    margin: 20px;
    background: var(--primary);
    border-radius: 24px;
    color: #fff;
    display: flex;
    flex-direction: column;
    position: fixed;
    z-index: 1000;
    box-shadow: var(--shadow);
}

.logo-area { padding: 32px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.logo-area h1 { font-size: 1.5em; font-weight: 800; letter-spacing: -0.5px; }

.nav { flex: 1; padding: 24px 12px; }
.nav-item {
    padding: 14px 20px;
    margin-bottom: 8px;
    border-radius: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: 0.2s;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
}
.nav-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
.nav-item.active { background: var(--accent); color: #fff; box-shadow: 0 4px 15px rgba(255,102,0,0.3); }

.main { flex: 1; margin-left: 300px; padding: 40px 60px; max-width: 1400px; }

.command-center {
    position: sticky; top: 20px; z-index: 900;
    background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); border-radius: 20px; padding: 12px 24px; margin-bottom: 40px;
    display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow);
}

.selector-group { display: flex; gap: 12px; align-items: center; }
.btn {
    padding: 8px 16px; border-radius: 12px; border: none; background: transparent;
    color: var(--muted); font-weight: 600; font-size: 0.85em; cursor: pointer; transition: 0.2s;
}
.btn:hover { background: rgba(0,0,0,0.05); color: var(--text); }
.btn.active { background: var(--text); color: var(--bg); }
.btn-branch.active { background: var(--accent); color: #fff; }

.glass-card {
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border); border-radius: 28px; padding: 32px;
    box-shadow: var(--shadow); margin-bottom: 32px;
}

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 40px; }
.kpi-premium {
    background: var(--card); border: 1px solid var(--glass-border); border-radius: 24px;
    padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
}
.kpi-premium .label { font-size: 0.7em; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.kpi-premium .value { font-size: 2.2em; font-weight: 800; color: var(--text); font-family: var(--mono); }
.kpi-premium .subtext { font-size: 0.8em; color: var(--muted); font-weight: 500; }

.premium-table { width: 100%; border-collapse: collapse; }
.premium-table th { text-align: left; padding: 16px; font-size: 0.7em; font-weight: 800; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--glass-border); }
.premium-table td { padding: 18px 16px; border-bottom: 1px solid var(--glass-border); font-size: 0.95em; font-weight: 500; }
.num { font-family: var(--mono); text-align: right; }

.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 32px; }

.section { display: none; }
.section.active { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.badge { padding: 4px 10px; border-radius: 8px; font-size: 0.7em; font-weight: 800; text-transform: uppercase; }
.badge-b1 { background: rgba(31, 78, 121, 0.1); color: var(--primary); }
.badge-b2 { background: rgba(255, 102, 0, 0.1); color: var(--accent); }

@media (max-width: 1024px) {
    .sidebar { width: 70px; margin: 10px; }
    .logo-area, .nav-item span { display: none; }
    .main { margin-left: 90px; padding: 20px; }
    .command-center { flex-direction: column; gap: 15px; }
}
</style>
</head>
<body>

<div class="sidebar">
    <div class="logo-area"><h1>SSJ</h1></div>
    <div class="nav">
        <div class="nav-item active" data-view="finance">📊 <span>Finance</span></div>
        <div class="nav-item" data-view="report">📜 <span>Reports</span></div>
        <div class="nav-item" data-view="inventory">🍎 <span>Stock</span></div>
        <div class="nav-item" data-view="analytics">📈 <span>Analytics</span></div>
        <div class="nav-item" data-view="log">📝 <span>Daily Log</span></div>
    </div>
</div>

<div class="main">
    <div class="command-center">
        <div class="selector-group">
            <div id="branchSelector"></div>
            <div style="width:1px; height:20px; background:var(--glass-border)"></div>
            <div id="monthSelector"></div>
        </div>
        <div id="status" style="font-size:0.75em; font-weight:700; color:var(--green)">● SYSTEM LIVE</div>
    </div>

    <div class="kpi-row" id="kpiGrid"></div>

    <div class="section active" id="view-finance">
        <div class="glass-card">
            <h3>Profit & Loss Statement</h3>
            <table class="premium-table"><tbody id="cfBody"></tbody></table>
        </div>
        <div class="dashboard-grid">
            <div class="glass-card"><h3>Blessme Sharing</h3><table class="premium-table"><tbody id="profitShareBody"></tbody></table></div>
            <div class="glass-card"><h3>Expense Mix</h3><div style="height:300px"><canvas id="chartExpMix"></canvas></div></div>
        </div>
        <div class="glass-card"><h3>Revenue Performance</h3><div style="height:400px"><canvas id="chartRevPay"></canvas></div></div>
    </div>

    <div class="section" id="view-report">
        <div class="command-center" style="position:static; margin-bottom:32px">
            <h2 id="reportTitle">Management Report</h2>
            <button class="btn active" onclick="downloadReport()" style="background:var(--accent); color:#fff">Export PDF</button>
        </div>
        <div id="reportContent" class="glass-card"><div id="reportTables"></div></div>
    </div>

    <div class="section" id="view-inventory">
        <div class="kpi-row" id="liveStockGrid"></div>
        <h2>Forecast</h2>
        <div id="forecastContainer" class="dashboard-grid"></div>
    </div>

    <div class="section" id="view-analytics">
        <div class="dashboard-grid">
            <div class="glass-card"><h3>Revenue Mix</h3><canvas id="chartProductMix"></canvas></div>
            <div class="glass-card"><h3>Yield</h3><canvas id="chartYield"></canvas></div>
        </div>
    </div>

    <div class="section" id="view-log">
        <div id="dailyLogGrid" class="dashboard-grid"></div>
    </div>
</div>

<script>
let DATA = null, LEDGER = null, REPORTS_DATA = null;
let currentBranch = 'all', currentMonth = 'all';
let charts = {};

const PARAMS = {
    prices: { orange: 60, orange_premium: 100, watermelon: 50, apple: 60, mango: 90, coconut: 60, young: 90, guava: 60 },
    rent: { B1: 35000, B2: 30000 },
    staffMonthly: { B1: 31000, B2: 18000 },
    fixedStock: { B1: 6000, B2: 6000 },
    profitShare: { B1: 0.60, B2: 0.70 }
};

const fmt = v => (v || 0).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:0});
const sum = (arr, k) => arr.reduce((s, r) => s + (Number(r[k]) || 0), 0);

async function init() {
    try {
        const [d, l, r] = await Promise.all([
            fetch('data.json?t='+Date.now()).then(res => res.json()),
            fetch('stock_ledger.json?t='+Date.now()).then(res => res.ok ? res.json() : null),
            fetch('reports_data.json?t='+Date.now()).then(res => res.ok ? res.json() : null)
        ]);
        DATA = d; LEDGER = l; REPORTS_DATA = r;
        
        // Auto-detect available months
        const allMonthsSet = new Set();
        Object.keys(DATA.branches).forEach(b => Object.keys(DATA.branches[b].sales).forEach(m => allMonthsSet.add(m)));
        const allMonths = Array.from(allMonthsSet).sort((a,b) => b.localeCompare(a));
        
        if(allMonths.includes('May26')) currentMonth = 'May26';
        else if(allMonths.length > 0) currentMonth = allMonths[0];

        renderBranchSelector();
        renderMonthSelector(allMonths);
        updateUI();
    } catch (e) { 
        console.error(e);
        document.body.innerHTML = `<div style="padding:100px; text-align:center"><h1>Data Load Error</h1><p>\${e.message}</p></div>`;
    }
}

function renderBranchSelector() {
    const branches = ['all', 'B1', 'B2'];
    document.getElementById('branchSelector').innerHTML = branches.map(b => 
        `<button class="btn btn-branch \${currentBranch===b?'active':''}" onclick="currentBranch='\${b}';updateUI()">\${b==='all'?'All Branches':b}</button>`
    ).join('');
}

function renderMonthSelector(months) {
    let mList = ['all', ...months];
    document.getElementById('monthSelector').innerHTML = mList.map(m => 
        `<button class="btn \${currentMonth===m?'active':''}" onclick="currentMonth='\${m}';updateUI()">\${m==='all'?'Full Year':m.replace('26','')}</button>`
    ).join('');
}

function updateUI() {
    const sales = getCleanSales(currentBranch, currentMonth);
    const expenses = (DATA.expenses || []).filter(e => (currentBranch==='all'||e.branch===currentBranch) && (currentMonth==='all'||e.month===currentMonth));
    
    renderKPIs(sales);
    renderFinance(sales, expenses);
    renderInventory(sales);
    renderAnalytics(sales);
    renderReport();
    renderDailyLog(sales);
    renderBranchSelector();
}

function getCleanSales(branch, month) {
    let combined = [];
    const bKeys = branch === 'all' ? Object.keys(DATA.branches) : [branch];
    bKeys.forEach(b => {
        const mKeys = month === 'all' ? Object.keys(DATA.branches[b].sales) : [month];
        mKeys.forEach(m => {
            if(DATA.branches[b].sales[m]) {
                combined = combined.concat(DATA.branches[b].sales[m].filter(r => r.d && !['Date', 'TOTAL', 'AVG'].includes(r.d)).map(r => ({ ...r, branch: b, month: m })));
            }
        });
    });
    return combined.sort((a,b) => {
        const da = a.d.split('/').map(n=>n.padStart(2,'0')).reverse().join('');
        const db = b.d.split('/').map(n=>n.padStart(2,'0')).reverse().join('');
        return da.localeCompare(db);
    });
}

function renderKPIs(sales) {
    const rev = sum(sales, 'rev'), cups = sum(sales, 'tot');
    const diff = sales.reduce((s, r) => s + (r.audit ? r.audit.rev_diff : 0), 0);
    document.getElementById('kpiGrid').innerHTML = `
        <div class="kpi-premium"><div class="label">Revenue</div><div class="value">฿\${fmt(rev)}</div><div class="subtext">\${sales.length} days</div></div>
        <div class="kpi-premium"><div class="label">Total Cups</div><div class="value">\${fmt(cups)}</div><div class="subtext">Sold</div></div>
        <div class="kpi-premium"><div class="label">Audit Diff</div><div class="value" style="color:\${diff<0?'var(--red)':'var(--green)'}">฿\${fmt(diff)}</div><div class="subtext">Accuracy</div></div>
    `;
}

function renderFinance(sales, expenses) {
    let bCalcs = {};
    ['B1', 'B2'].forEach(b => {
        const bs = sales.filter(s => s.branch === b);
        if(!bs.length) return;
        const br = sum(bs, 'rev');
        const bu = bs.reduce((s, r) => s + ((r.uo||0)*700 + (r.uw||0)*35 + (r.uap||0)*30 + (r.umg||0)*150 + (r.uco_raw||0)*35), 0);
        const bf = (PARAMS.rent[b]||0) + (PARAMS.staffMonthly[b]||0) + (PARAMS.fixedStock[b]||0);
        const bn = br - bu - bf;
        bCalcs[b] = { rev: br, net: bn, share: Math.max(0, bn * (PARAMS.profitShare[b]||0)) };
    });

    const tRev = Object.values(bCalcs).reduce((s,b)=>s+b.rev, 0);
    const tNet = Object.values(bCalcs).reduce((s,b)=>s+b.net, 0);

    document.getElementById('cfBody').innerHTML = `
        <tr><td><b>Gross Revenue</b></td><td class="num">฿\${fmt(tRev)}</td><td class="num">100%</td></tr>
        <tr><td><b>Operational Profit</b></td><td class="num">฿\${fmt(tNet)}</td><td class="num">\${tRev?(tNet/tRev*100).toFixed(1)+'%':'0%'}</td></tr>
    `;

    document.getElementById('profitShareBody').innerHTML = Object.keys(bCalcs).map(b => `
        <tr><td><span class="badge badge-\${b.toLowerCase()}">\${b}</span></td><td class="num">฿\${fmt(bCalcs[b].net)}</td><td class="num" style="color:var(--accent)"><b>฿\${fmt(bCalcs[b].share)}</b></td></tr>
    `).join('');
    
    if(charts.rev) charts.rev.destroy();
    charts.rev = new Chart(document.getElementById('chartRevPay'), {
        type: 'line',
        data: { labels: sales.map(r=>r.d), datasets: [{ label: 'Revenue', data: sales.map(r=>r.rev), borderColor: '#ff6600', tension: 0.4 }] },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

function renderInventory(sales) {
    const items = [{ k: 'orange', b: 'uo', i: '🍊', n: 'Orange' }, { k: 'watermelon', b: 'uw', i: '🍉', n: 'Watermelon' }];
    document.getElementById('liveStockGrid').innerHTML = items.map(item => {
        const burn = sum(sales, item.b);
        return `<div class="kpi-premium"><div class="label">\${item.i} \${item.n} Burn</div><div class="value">\${burn.toFixed(1)}</div></div>`;
    }).join('');
}

function renderDailyLog(sales) {
    document.getElementById('dailyLogGrid').innerHTML = sales.slice().reverse().map(r => `
        <div class="kpi-premium">
            <div style="display:flex; justify-content:space-between"><b>\${r.d}</b> <span class="badge badge-\${r.branch.toLowerCase()}">\${r.branch}</span></div>
            <div class="value" style="font-size:1.5em; margin:10px 0">฿\${fmt(r.rev)}</div>
            <div style="font-size:0.8em; color:var(--muted)">Cups: \${r.tot} | Diff: \${r.audit?r.audit.rev_diff:0}</div>
        </div>
    `).join('');
}

function renderAnalytics(sales) {
    if(charts.mix) charts.mix.destroy();
    const mix = { Or: sum(sales,'or'), Wm: sum(sales,'wm'), Mg: sum(sales,'mg'), Co: sum(sales,'co') };
    charts.mix = new Chart(document.getElementById('chartProductMix'), { type: 'pie', data: { labels: Object.keys(mix), datasets: [{ data: Object.values(mix), backgroundColor: ['#ff9800','#4caf50','#ffc107','#795548'] }] } });
}

function renderReport() {
    if (!REPORTS_DATA || !REPORTS_DATA[currentMonth]) return;
    const r = REPORTS_DATA[currentMonth];
    document.getElementById('reportTitle').innerText = (currentMonth==='all'?'FULL YEAR':currentMonth.toUpperCase()) + ' MANAGEMENT REPORT';
    document.getElementById('reportTables').innerHTML = `
        <div class="glass-card" style="padding:20px; border:none; background:rgba(0,0,0,0.02)">
            <h3 style="color:var(--accent); margin-bottom:20px">1. EXECUTIVE SUMMARY</h3>
            <div class="kpi-row" style="margin-bottom:0">
                <div class="kpi-premium"><div class="label">Total Network Revenue</div><div class="value">฿\${fmt(r.total_rev)}</div></div>
                <div class="kpi-premium"><div class="label">Consolidated Net Profit</div><div class="value" style="color:var(--green)">฿\${fmt(r.b1.net+r.b2.net)}</div></div>
            </div>
        </div>

        <div class="glass-card" style="padding:20px; border:none; background:rgba(0,0,0,0.02)">
            <h3 style="color:var(--accent); margin-bottom:20px">2. BRANCH PERFORMANCE</h3>
            <table class="premium-table">
                <thead><tr><th>Branch</th><th class="num">Revenue</th><th class="num">COGS Share</th><th class="num">Net Profit</th><th class="num">Blessme</th></tr></thead>
                <tbody>
                    <tr><td>Branch 1 (B1)</td><td class="num">฿\${fmt(r.b1.rev)}</td><td class="num">฿\${fmt(r.b1.cogs)}</td><td class="num">฿\${fmt(r.b1.net)}</td><td class="num" style="color:var(--accent)"><b>฿\${fmt(r.b1.share)}</b></td></tr>
                    <tr><td>Branch 2 (B2)</td><td class="num">฿\${fmt(r.b2.rev)}</td><td class="num">฿\${fmt(r.b2.cogs)}</td><td class="num">฿\${fmt(r.b2.net)}</td><td class="num" style="color:var(--accent)"><b>฿\${fmt(r.b2.share)}</b></td></tr>
                </tbody>
            </table>
        </div>

        <div class="glass-card" style="padding:20px; border:none; background:rgba(0,0,0,0.02)">
            <h3 style="color:var(--accent); margin-bottom:20px">3. SHARED COGS BREAKDOWN</h3>
            <table class="premium-table">
                <thead><tr><th>Category</th><th class="num">Amount</th></tr></thead>
                <tbody>
                    \${Object.keys(r.fruit_summary).map(k => `<tr><td>\${k}</td><td class="num">฿\${fmt(r.fruit_summary[k])}</td></tr>`).join('')}
                    <tr style="background:rgba(0,0,0,0.05)"><td><b>TOTAL COGS</b></td><td class="num"><b>฿\${fmt(r.total_cogs)}</b></td></tr>
                </tbody>
            </table>
        </div>

        <div class="glass-card" style="padding:20px; border:none; background:rgba(0,0,0,0.02)">
            <h3 style="color:var(--accent); margin-bottom:20px">4. FRUIT ROI PERFORMANCE</h3>
            <table class="premium-table">
                <thead><tr><th>Fruit</th><th class="num">Rev</th><th class="num">Cost</th><th class="num">ROI</th><th class="num">Cups</th></tr></thead>
                <tbody>\${r.fruit_performance.filter(f=>f.cups>0).map(f=>`<tr><td>\${f.name}</td><td class="num">฿\${fmt(f.rev)}</td><td class="num">฿\${fmt(f.cost)}</td><td class="num" style="color:var(--green)">\${f.roi}</td><td class="num">\${f.cups}</td></tr>`).join('')}</tbody>
            </table>
        </div>

        <div class="glass-card" style="padding:20px; border:none; background:rgba(0,0,0,0.02)">
            <h3 style="color:var(--accent); margin-bottom:20px">5. OPERATING EXPENSES (OPEX)</h3>
            <div style="max-height:400px; overflow-y:auto">
                <table class="premium-table">
                    <thead><tr><th>Branch</th><th>Category</th><th>Description</th><th class="num">Amount</th></tr></thead>
                    <tbody>
                        \${r.b1.opex_list.map(e => `<tr><td><span class="badge badge-b1">B1</span></td><td>\${e.cat}</td><td>\${e.desc}</td><td class="num">฿\${fmt(e.amt)}</td></tr>`).join('')}
                        \${r.b2.opex_list.map(e => `<tr><td><span class="badge badge-b2">B2</span></td><td>\${e.cat}</td><td>\${e.desc}</td><td class="num">฿\${fmt(e.amt)}</td></tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

function downloadReport() { window.print(); }

document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('view-' + item.dataset.view).classList.add('active');
    });
});

init();
</script>
</body>
</html>
